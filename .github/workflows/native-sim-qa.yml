name: NativeSim iOS QA
run-name: NativeSim QA · ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full ajustes-codex SHA whose committed tree must match the Public app snapshot
        required: true
        type: string
      confirm_synthetic_test_data:
        description: Confirm the test account and all data visible in public screenshots/video are fictitious and safe to publish
        required: true
        default: false
        type: boolean
      confirm_cached_quick_login_app_current:
        description: Confirm the cached app was built with current Quick Login secrets, or those secrets have not changed since it was built
        required: true
        default: false
        type: boolean
      simulator_device:
        description: iOS Simulator device
        required: true
        default: iPhone 17 Pro
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: native-sim-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Require explicit public-evidence safety confirmation
        if: ${{ inputs.confirm_synthetic_test_data != true || inputs.confirm_cached_quick_login_app_current != true }}
        env:
          QA_ARTIFACT_DIR: ${{ runner.temp }}/native-sim-qa/${{ github.run_id }}
          PUBLIC_EVIDENCE_SYNTHETIC_ONLY: ${{ inputs.confirm_synthetic_test_data }}
          CACHED_QUICK_LOGIN_CURRENT: ${{ inputs.confirm_cached_quick_login_app_current }}
        run: |
          set -euo pipefail
          mkdir -p "$QA_ARTIFACT_DIR"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = {
            schemaVersion: 1,
            status: 'blocked',
            dataSafety: {
              publicArtifact: true,
              syntheticTestDataConfirmed: process.env.PUBLIC_EVIDENCE_SYNTHETIC_ONLY === 'true',
              cachedQuickLoginConfigConfirmed: process.env.CACHED_QUICK_LOGIN_CURRENT === 'true',
              confirmationMechanism: 'workflow_dispatch operator attestation',
            },
            actions: [{ name: 'public_evidence_safety_confirmation', status: 'blocked' }],
            errors: [{
              step: 'public_evidence_safety_confirmation',
              message: 'Evidence upload was blocked because public-data safety and cached Quick Login freshness were not both confirmed.',
            }],
            evidence: [],
          };
          fs.writeFileSync(path.join(process.env.QA_ARTIFACT_DIR, 'report.json'), `${JSON.stringify(report, null, 2)}\n`);
          NODE
          echo '::error::Confirm that the test data are fictitious and the cached app matches the current Quick Login secrets before QA can proceed.'
          exit 1

      - name: Select candidate Public sync commit
        id: source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::source_sha must be a full 40-character ajustes-codex SHA.'
            exit 1
          fi

          SOURCE_SHA_SHORT=${EXPECTED_SOURCE_SHA:0:7}
          SYNC_COMMIT=$(git log -1 --format='%H' --grep="^sync: mirror ajustes-codex ${SOURCE_SHA_SHORT}$")
          [ -n "$SYNC_COMMIT" ] || {
            echo '::error::No Public sync commit matches the requested source SHA prefix.'
            exit 1
          }

          echo "commit=$SYNC_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Selected candidate sync commit by 7-character hint: $SYNC_COMMIT"

      - name: Check out the synchronized app snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}
          path: app-source
          fetch-depth: 0

      - name: Require private source read token
        env:
          SOURCE_READ_TOKEN_PRESENT: ${{ secrets.NATIVESIM_QA_SOURCE_READ_TOKEN != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_READ_TOKEN_PRESENT" != 'true' ]]; then
            echo '::error::Repository secret NATIVESIM_QA_SOURCE_READ_TOKEN is required to check out the private source snapshot.'
            exit 1
          fi

      - name: Check out the exact source snapshot
        uses: actions/checkout@v4
        with:
          repository: LuanRigatti/emporiorigatti
          ref: ${{ inputs.source_sha }}
          path: source-snapshot
          fetch-depth: 1
          token: ${{ secrets.NATIVESIM_QA_SOURCE_READ_TOKEN }}
          persist-credentials: false

      - name: Verify exact source commit and synchronized tree
        id: verify-source
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          SYNC_COMMIT: ${{ steps.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SOURCE_SHA=$(git -C source-snapshot rev-parse HEAD)
          if [[ "$CHECKED_OUT_SOURCE_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo '::error::The source checkout did not resolve to the exact requested commit.'
            exit 1
          fi

          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          const excluded = new Set([
            'AGENTS.md',
            '.github/workflows/native-sim.yml',
            '.github/workflows/eas-build.yml',
            '.github/workflows/swift-preflight.yml',
            '.github/workflows/native-sim-qa.yml',
            '.github/native-sim/gate.cjs',
            'scripts/native-sim-qa.mjs',
          ]);

          function trackedTree(directory) {
            const output = execFileSync('git', ['-C', directory, 'ls-files', '--stage', '-z'], {
              encoding: 'utf8',
            });
            const entries = new Map();

            for (const record of output.split('\0').filter(Boolean)) {
              const match = record.match(/^(\d{6}) ([0-9a-f]+) ([0-3])\t([\s\S]*)$/);
              if (!match || match[3] !== '0') {
                throw new Error(`Unexpected staged-tree entry in ${directory}.`);
              }
              const [, mode, objectId, , filePath] = match;
              if (!excluded.has(filePath)) entries.set(filePath, `${mode} ${objectId}`);
            }

            return entries;
          }

          const source = trackedTree('source-snapshot');
          const mirror = trackedTree('app-source');
          const paths = new Set([...source.keys(), ...mirror.keys()]);
          const differences = [...paths]
            .filter((filePath) => source.get(filePath) !== mirror.get(filePath))
            .sort();

          if (differences.length > 0) {
            console.error(`::error::Source snapshot and Public sync tree differ in ${differences.length} non-infrastructure path(s).`);
            console.error(differences.slice(0, 30).join('\n'));
            process.exit(1);
          }

          console.log(`Exact source commit and tracked tree verified; compared ${paths.size} non-infrastructure paths.`);
          NODE

          echo "source_sha_verified=$EXPECTED_SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Install locked app dependencies for fingerprint
        working-directory: app-source
        run: npm ci

      - name: Compute the exact NativeSim app cache key
        id: app
        working-directory: app-source
        shell: bash
        run: |
          set -euo pipefail
          APP_REVISION_SHA=$(git rev-list -1 HEAD -- . \
            ':(exclude).github/workflows/native-sim.yml' \
            ':(exclude).github/native-sim/gate.cjs')
          [ -n "$APP_REVISION_SHA" ] || {
            echo '::error::Could not resolve the NativeSim app cache revision.'
            exit 1
          }

          # Match the locked fingerprint implementation used by the NativeSim build.
          FINGERPRINT=$(npx --yes @expo/fingerprint@0.20.13 fingerprint:generate --platform ios \
            | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).hash)')
          [ -n "$FINGERPRINT" ] || {
            echo '::error::Could not compute the iOS native fingerprint.'
            exit 1
          }

          CACHE_KEY="native-sim-app-${RUNNER_OS}-release-keychain-signed-v2-${APP_REVISION_SHA}-${FINGERPRINT}"
          echo "revision_sha=$APP_REVISION_SHA" >> "$GITHUB_OUTPUT"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "cache_key=$CACHE_KEY" >> "$GITHUB_OUTPUT"
          echo "App revision: $APP_REVISION_SHA"
          echo "iOS native fingerprint: $FINGERPRINT"

      - name: Restore the existing compiled Simulator app
        id: appcache
        uses: actions/cache/restore@v4
        with:
          path: build/native-sim-app
          key: ${{ steps.app.outputs.cache_key }}

      - name: Write a blocked report when no exact app cache exists
        if: steps.appcache.outputs.cache-hit != 'true'
        env:
          APP_CACHE_KEY: ${{ steps.app.outputs.cache_key }}
          APP_REVISION_SHA: ${{ steps.app.outputs.revision_sha }}
          APP_PUBLIC_SHA: ${{ steps.source.outputs.commit }}
          QA_ARTIFACT_DIR: ${{ runner.temp }}/native-sim-qa/${{ github.run_id }}
          QA_WORKFLOW_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA_VERIFIED: ${{ steps.verify-source.outputs.source_sha_verified }}
        run: |
          mkdir -p "$QA_ARTIFACT_DIR"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const report = {
            schemaVersion: 1,
            status: 'blocked',
            runId: process.env.RUN_ID,
            testWorkflowSha: process.env.QA_WORKFLOW_SHA,
            app: {
              publicSyncCommit: process.env.APP_PUBLIC_SHA,
              sourceRepository: 'LuanRigatti/emporiorigatti',
              appRevisionSha: process.env.APP_REVISION_SHA,
              sourceShaVerified: process.env.SOURCE_SHA_VERIFIED,
              cacheKey: process.env.APP_CACHE_KEY,
            },
            actions: [{ name: 'restore_exact_app_cache', status: 'failed' }],
            errors: [{
              step: 'restore_exact_app_cache',
              message: 'No exact cached .app matched the synchronized source SHA and iOS fingerprint. Simulator was not started; no build was attempted.',
            }],
            evidence: [],
          };
          fs.writeFileSync(path.join(process.env.QA_ARTIFACT_DIR, 'report.json'), `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Require an exact existing app cache
        if: steps.appcache.outputs.cache-hit != 'true'
        run: |
          echo '::error::No exact .app cache exists for the synchronized source SHA and iOS fingerprint. This workflow never builds.'
          exit 1

      - name: Validate cached app bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          APPS=(build/native-sim-app/*.app)
          shopt -u nullglob
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo '::error::Expected exactly one cached .app bundle.'
            exit 1
          fi

          INFO_PLIST="${APPS[0]}/Info.plist"
          [ -f "$INFO_PLIST" ] || {
            echo '::error::Cached .app has no Info.plist.'
            exit 1
          }
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST")
          [[ "$BUNDLE_ID" =~ ^[A-Za-z0-9.-]+$ ]] || {
            echo '::error::Cached .app has an invalid bundle identifier.'
            exit 1
          }

          echo "app_path=${APPS[0]}" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "Validated cached Simulator bundle: $BUNDLE_ID"

      - name: Install local agent-device
        run: npm install --global --no-audit --no-fund agent-device@0.20.1

      - name: Run isolated iOS Quick Login and mode smoke flow
        env:
          AGENT_DEVICE_VERSION: 0.20.1
          APP_BUNDLE_ID: ${{ steps.bundle.outputs.bundle_id }}
          APP_CACHE_KEY: ${{ steps.app.outputs.cache_key }}
          APP_REVISION_SHA: ${{ steps.app.outputs.revision_sha }}
          APP_PUBLIC_SHA: ${{ steps.source.outputs.commit }}
          APP_PATH: ${{ steps.bundle.outputs.app_path }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          PUBLIC_EVIDENCE_SYNTHETIC_ONLY: ${{ inputs.confirm_synthetic_test_data }}
          CACHED_QUICK_LOGIN_CURRENT: ${{ inputs.confirm_cached_quick_login_app_current }}
          QA_ARTIFACT_DIR: ${{ runner.temp }}/native-sim-qa/${{ github.run_id }}
          QA_WORKFLOW_SHA: ${{ github.sha }}
          SIMULATOR_DEVICE: ${{ inputs.simulator_device }}
          SOURCE_SHA_VERIFIED: ${{ steps.verify-source.outputs.source_sha_verified }}
          SYNC_COMMIT: ${{ steps.source.outputs.commit }}
        run: node scripts/native-sim-qa.mjs

      - name: Upload QA report and visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-sim-qa-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-sim-qa/${{ github.run_id }}/report.json
            ${{ runner.temp }}/native-sim-qa/${{ github.run_id }}/screenshots/*.png
            ${{ runner.temp }}/native-sim-qa/${{ github.run_id }}/video/*.mov
          # Never include the cached .app, runner logs, or agent-device telemetry.
          if-no-files-found: warn
          retention-days: 1
