name: Swift preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-card-context-menu:
    name: Compile NativeCardContextMenu (iOS Simulator)
    runs-on: macos-26
    timeout-minutes: 240
    env:
      APP_VARIANT: standard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify SDK 58 toolchain minimums
        run: |
          set -euo pipefail
          node <<'NODE'
          const { execFileSync } = require('node:child_process');

          function compareVersions(left, right) {
            const a = left.split('.').map(Number);
            const b = right.split('.').map(Number);
            for (let index = 0; index < Math.max(a.length, b.length); index += 1) {
              const difference = (a[index] ?? 0) - (b[index] ?? 0);
              if (difference !== 0) return Math.sign(difference);
            }
            return 0;
          }

          const nodeVersion = process.versions.node;
          if (compareVersions(nodeVersion, '22.13.0') < 0) {
            throw new Error(`Expo SDK 58 requires Node.js >=22.13.x; found ${nodeVersion}`);
          }

          const xcodeOutput = execFileSync('xcodebuild', ['-version'], { encoding: 'utf8' });
          const xcodeVersion = xcodeOutput.match(/^Xcode (\d+(?:\.\d+)+)$/m)?.[1];
          if (!xcodeVersion || compareVersions(xcodeVersion, '26.4.0') < 0) {
            throw new Error(`Expo SDK 58 requires Xcode >=26.4; found ${xcodeVersion ?? 'unknown'}`);
          }

          console.log(`SDK 58 toolchain confirmed: Node.js ${nodeVersion}, Xcode ${xcodeVersion}`);
          NODE

      - name: Cache npm and CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/Library/Caches/CocoaPods
          key: native-sim-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') }}
          restore-keys: native-sim-${{ runner.os }}-

      - name: Install JavaScript dependencies
        timeout-minutes: 20
        run: npm ci

      - name: TypeScript typecheck
        timeout-minutes: 15
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Generate iOS project
        timeout-minutes: 20
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods
        timeout-minutes: 25
        run: pod install --project-directory=ios

      - name: Verify toolbar morph plugin output and native targets
        timeout-minutes: 10
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const screensVersion = JSON.parse(
            fs.readFileSync('node_modules/react-native-screens/package.json', 'utf8'),
          ).version;
          const expoUiVersion = JSON.parse(
            fs.readFileSync('node_modules/@expo/ui/package.json', 'utf8'),
          ).version;
          if (screensVersion !== '4.30.0' || expoUiVersion !== '58.0.19') {
            throw new Error(`Unexpected native patch anchors: RNScreens ${screensVersion}, ExpoUI ${expoUiVersion}`);
          }

          const controllerPath = 'node_modules/react-native-screens/ios/tabs/host/RNSTabBarController.mm';
          const headerConfigPath = 'node_modules/react-native-screens/ios/RNSScreenStackHeaderConfig.mm';
          const controller = fs.readFileSync(controllerPath, 'utf8');
          const headerConfig = fs.readFileSync(headerConfigPath, 'utf8');
          const requiredMarkers = [
            [controllerPath, 'Emporio Rigatti: shared tab toolbar controller'],
            [controllerPath, 'static inline NSString *RNSCurrentToolbarMorphExperimentVariant(void)'],
            [controllerPath, 'static inline NSString *RNSRoleForToolbarMorphIdentifier(NSString *identifier)'],
            [controllerPath, 'static inline NSString *RNSRoleForToolbarMorphItem(UIBarButtonItem *item)'],
            [controllerPath, 'static BOOL RNSShouldSkipSharedToolbarExperimentRepairOnce('],
            [headerConfigPath, 'Emporio Rigatti: shared tab toolbar config helpers'],
          ];

          for (const [path, marker] of requiredMarkers) {
            const source = path === controllerPath ? controller : headerConfig;
            if (!source.includes(marker)) {
              throw new Error(`Expected applied config-plugin marker is missing: ${path} :: ${marker}`);
            }
          }

          const bottomSheet = fs.readFileSync(
            'node_modules/@expo/ui/ios/BottomSheetView.swift',
            'utf8',
          );
          if (!bottomSheet.includes('.ignoresSafeArea(.container, edges: .bottom)')) {
            throw new Error('The existing ExpoUI BottomSheet patch was not applied during install.');
          }

          const appConfig = fs.readFileSync('app.config.js', 'utf8');
          if (!appConfig.includes("'./plugins/withRNScreensHideBottomBarWhenPushed'")) {
            throw new Error('The shared toolbar coordinator config plugin is not registered.');
          }

          const podsProject = 'ios/Pods/Pods.xcodeproj';
          const pods = JSON.parse(
            execFileSync('xcodebuild', ['-list', '-json', '-project', podsProject], {
              encoding: 'utf8',
            }),
          ).project;
          const requiredTargets = ['RNScreens', 'ExpoUI'];
          const missingTargets = requiredTargets.filter((target) => !pods.targets.includes(target));
          if (missingTargets.length > 0) {
            throw new Error(`Generated CocoaPods project is missing native targets: ${missingTargets.join(', ')}`);
          }

          console.log(`Verified current shared toolbar helpers and ExpoUI patches.`);
          console.log(`Generated native targets confirmed: ${requiredTargets.join(', ')}`);
          NODE

      - name: Compile toolbar morph native targets only
        timeout-minutes: 60
        run: |
          set -euo pipefail
          PODS_PROJECT="ios/Pods/Pods.xcodeproj"
          LOG_DIR="build/toolbar-morph-preflight"
          mkdir -p "$LOG_DIR"

          for TARGET_NAME in RNScreens ExpoUI; do
            echo "::group::Compile $TARGET_NAME only"
            xcodebuild \
              -project "$PODS_PROJECT" \
              -target "$TARGET_NAME" \
              -configuration Release \
              -sdk iphonesimulator \
              CODE_SIGNING_ALLOWED=NO \
              build 2>&1 | tee "$LOG_DIR/${TARGET_NAME}.xcodebuild.log"
            echo "::endgroup::"
          done

      - name: Verify generated Pods target and configuration
        env:
          TARGET_NAME: NativeCardContextMenu
        run: |
          set -euo pipefail
          PODS_PROJECT="ios/Pods/Pods.xcodeproj"
          [ -d "$PODS_PROJECT" ] || { echo "::error::CocoaPods project not found at $PODS_PROJECT"; exit 1; }

          TARGETS_JSON=$(xcodebuild -list -json -project "$PODS_PROJECT")
          printf '%s' "$TARGETS_JSON" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const project = JSON.parse(input).project;
              const target = process.argv[1];
              if (!project?.targets?.includes(target)) {
                console.error(`::error::Generated Pods project has no target named ${target}`);
                console.error(`Available targets: ${(project?.targets || []).join(", ")}`);
                process.exit(1);
              }
              console.log(`Generated Pods target confirmed: ${target}`);
            });
          ' "$TARGET_NAME"

          mkdir -p build/native-card-context-menu-preflight
          xcodebuild \
            -showBuildSettings \
            -project "$PODS_PROJECT" \
            -target "$TARGET_NAME" \
            -configuration Release \
            -sdk iphonesimulator \
            > build/native-card-context-menu-preflight/build-settings.txt

          grep -Fq 'CONFIGURATION = Release' build/native-card-context-menu-preflight/build-settings.txt || {
            echo '::error::Generated target did not resolve to the Release configuration'
            exit 1
          }
          grep -Fq 'SDKROOT = iphonesimulator' build/native-card-context-menu-preflight/build-settings.txt || {
            echo '::error::Generated target did not resolve to the iOS Simulator SDK'
            exit 1
          }
          echo "Confirmed $TARGET_NAME / Release / iphonesimulator"

      - name: Compile NativeCardContextMenu only
        timeout-minutes: 45
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Pods/Pods.xcodeproj \
            -target NativeCardContextMenu \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/native-card-context-menu-preflight/xcodebuild.log

      - name: Verify NativeWidgetOperationalErrors Pods target
        timeout-minutes: 5
        run: |
          set -euo pipefail
          PODS_PROJECT="ios/Pods/Pods.xcodeproj"
          TARGET_NAME="NativeWidgetOperationalErrors"
          [ -d "$PODS_PROJECT" ] || { echo "::error::CocoaPods project not found at $PODS_PROJECT"; exit 1; }

          TARGETS_JSON=$(xcodebuild -list -json -project "$PODS_PROJECT")
          printf '%s' "$TARGETS_JSON" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const project = JSON.parse(input).project;
              const target = process.argv[1];
              if (!project?.targets?.includes(target)) {
                console.error(`::error::Generated Pods project has no target named ${target}`);
                console.error(`Available targets: ${(project?.targets || []).join(", ")}`);
                process.exit(1);
              }
              console.log(`Generated Pods target confirmed: ${target}`);
            });
          ' "$TARGET_NAME"

          mkdir -p build/native-widget-operational-errors-preflight
          xcodebuild \
            -showBuildSettings \
            -project "$PODS_PROJECT" \
            -target "$TARGET_NAME" \
            -configuration Release \
            -sdk iphonesimulator \
            > build/native-widget-operational-errors-preflight/pods-build-settings.txt

          grep -Fq 'CONFIGURATION = Release' build/native-widget-operational-errors-preflight/pods-build-settings.txt || {
            echo '::error::NativeWidgetOperationalErrors did not resolve to the Release configuration'
            exit 1
          }
          grep -Fq 'SDKROOT = iphonesimulator' build/native-widget-operational-errors-preflight/pods-build-settings.txt || {
            echo '::error::NativeWidgetOperationalErrors did not resolve to the iOS Simulator SDK'
            exit 1
          }
          echo "Confirmed $TARGET_NAME / Release / iphonesimulator"

      - name: Compile NativeWidgetOperationalErrors only
        timeout-minutes: 30
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Pods/Pods.xcodeproj \
            -target NativeWidgetOperationalErrors \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/native-widget-operational-errors-preflight/xcodebuild.log

      - name: Verify generated WidgetKit, App Intents, and Live Activity configuration
        timeout-minutes: 5
        run: |
          set -euo pipefail
          APP_PROJECT="ios/emporiorigatti.xcodeproj"
          WIDGET_TARGET="ExpoWidgetsTarget"
          WIDGET_DIR="ios/ExpoWidgetsTarget"
          WIDGET_INFO_PLIST="$WIDGET_DIR/Info.plist"
          WIDGET_INDEX_SWIFT="$WIDGET_DIR/index.swift"
          WIDGET_SWIFT="$WIDGET_DIR/ResumoFinanceiro.swift"
          DELIVERIES_WIDGET_SWIFT="$WIDGET_DIR/EntregasDoDia.swift"
          DELIVERY_INTENT_SWIFT="node_modules/expo-widgets/ios/Widgets/DeliveryWidgetCompletionIntent.swift"
          EXPO_WIDGETS_LIVE_ACTIVITY_SWIFT="node_modules/expo-widgets/ios/Widgets/WidgetLiveActivity.swift"
          EXPO_WIDGETS_PODSPEC="node_modules/expo-widgets/ios/ExpoWidgets.podspec"
          WIDGET_ENTITLEMENTS="$WIDGET_DIR/ExpoWidgetsTarget.entitlements"
          WIDGETS_UTILS_SWIFT="node_modules/expo-widgets/ios/Widgets/Utils.swift"
          WIDGETS_ENTRY_VIEW_SWIFT="node_modules/expo-widgets/ios/Widgets/EntryView.swift"
          [ -d "$APP_PROJECT" ] || { echo "::error::Generated app project not found at $APP_PROJECT"; exit 1; }
          [ -f "$WIDGET_INFO_PLIST" ] || { echo "::error::Generated WidgetKit Info.plist not found at $WIDGET_INFO_PLIST"; exit 1; }
          [ -f "$WIDGET_INDEX_SWIFT" ] || { echo "::error::Generated WidgetKit bundle source not found at $WIDGET_INDEX_SWIFT"; exit 1; }
          [ -f "$WIDGET_SWIFT" ] || { echo "::error::Generated widget Swift source not found at $WIDGET_SWIFT"; exit 1; }
          [ -f "$DELIVERIES_WIDGET_SWIFT" ] || { echo "::error::Generated deliveries widget Swift source not found at $DELIVERIES_WIDGET_SWIFT"; exit 1; }
          [ -f "$DELIVERY_INTENT_SWIFT" ] || { echo "::error::Generated delivery Live Activity intent source not found at $DELIVERY_INTENT_SWIFT"; exit 1; }
          [ -f "$EXPO_WIDGETS_LIVE_ACTIVITY_SWIFT" ] || { echo "::error::Expo Widgets ActivityKit source not found at $EXPO_WIDGETS_LIVE_ACTIVITY_SWIFT"; exit 1; }
          [ -f "$EXPO_WIDGETS_PODSPEC" ] || { echo "::error::Expo Widgets podspec not found at $EXPO_WIDGETS_PODSPEC"; exit 1; }
          [ -f "$WIDGET_ENTITLEMENTS" ] || { echo "::error::Generated WidgetKit App Group entitlements not found at $WIDGET_ENTITLEMENTS"; exit 1; }
          [ -f "$WIDGETS_UTILS_SWIFT" ] || { echo "::error::Expo Widgets shared environment source not found at $WIDGETS_UTILS_SWIFT"; exit 1; }
          [ -f "$WIDGETS_ENTRY_VIEW_SWIFT" ] || { echo "::error::Expo Widgets shared entry view source not found at $WIDGETS_ENTRY_VIEW_SWIFT"; exit 1; }

          ruby - "$APP_PROJECT" "$WIDGET_TARGET" <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open(ARGV.fetch(0))
          widget_target_name = ARGV.fetch(1)
          widget_target = project.targets.find { |target| target.name == widget_target_name }
          abort("::error::Generated app project has no target named #{widget_target_name}") unless widget_target
          unless widget_target.product_type == 'com.apple.product-type.app-extension'
            abort("::error::#{widget_target_name} is not an app-extension target")
          end

          app_target = project.targets.find { |target| target.product_type == 'com.apple.product-type.application' }
          if app_target && widget_target.dependencies.any? { |dependency| dependency.target&.uuid == app_target.uuid }
            abort("::error::#{widget_target_name} depends on the full app target; refusing to compile the app")
          end

          puts "Generated WidgetKit extension target confirmed: #{widget_target.name} (#{widget_target.product_type})"
          puts "Widget extension has no direct dependency on the full app target: #{app_target&.name || 'not found'}"
          RUBY

          EXTENSION_POINT=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$WIDGET_INFO_PLIST")
          [ "$EXTENSION_POINT" = "com.apple.widgetkit-extension" ] || {
            echo "::error::Generated target is not a WidgetKit extension (NSExtensionPointIdentifier=$EXTENSION_POINT)"
            exit 1
          }

          node - "$WIDGET_INDEX_SWIFT" "$WIDGET_SWIFT" "$DELIVERIES_WIDGET_SWIFT" "$WIDGETS_UTILS_SWIFT" "$WIDGETS_ENTRY_VIEW_SWIFT" "$DELIVERY_INTENT_SWIFT" "$EXPO_WIDGETS_LIVE_ACTIVITY_SWIFT" "$EXPO_WIDGETS_PODSPEC" <<'NODE'
          const fs = require('node:fs');

          const [indexPath, financePath, deliveriesPath, utilsPath, entryViewPath, intentPath, liveActivityPath, podspecPath] = process.argv.slice(2);
          const index = fs.readFileSync(indexPath, 'utf8');
          const finance = fs.readFileSync(financePath, 'utf8');
          const deliveries = fs.readFileSync(deliveriesPath, 'utf8');
          const utils = fs.readFileSync(utilsPath, 'utf8');
          const entryView = fs.readFileSync(entryViewPath, 'utf8');
          const intent = fs.readFileSync(intentPath, 'utf8');
          const liveActivity = fs.readFileSync(liveActivityPath, 'utf8');
          const podspec = fs.readFileSync(podspecPath, 'utf8');
          const count = (source, fragment) => source.split(fragment).length - 1;

          if (!index.includes('WidgetLiveActivity()')) {
            throw new Error('::error::Generated WidgetKit bundle does not register WidgetLiveActivity()');
          }

          for (const [path, source, fragments] of [
            [financePath, finance, ['AppIntentConfiguration(', 'getWidgetEnvironment(environment: environment)']],
            [deliveriesPath, deliveries, ['StaticConfiguration(', 'WidgetsEntryView(entry: entry)']],
          ]) {
            for (const fragment of fragments) {
              if (!source.includes(fragment)) {
                throw new Error(`::error::Generated widget source is missing ${fragment} in ${path}`);
              }
            }
          }

          const declarations = [
            'struct ResumoFinanceiroConfigurationAppIntent: WidgetConfigurationIntent {',
            'enum ResumoFinanceiroModeEnum: String, CaseIterable, AppEnum {',
            'struct ResumoFinanceiroTimelineEntry: TimelineEntry {',
            'struct ResumoFinanceiroTimelineProvider: AppIntentTimelineProvider {',
            'struct ResumoFinanceiroEntryView: View {',
          ];
          const financeLines = finance.split(/\r?\n/).map((line) => line.trim());
          for (const declaration of declarations) {
            const indices = financeLines.flatMap((line, index) => line === declaration ? [index] : []);
            if (
              indices.length !== 1 ||
              indices[0] === 0 ||
              financeLines[indices[0] - 1] !== '@available(iOS 17.0, *)'
            ) {
              throw new Error(`::error::Generated finance widget is missing its iOS 17 availability annotation: ${declaration}`);
            }
          }

          const brandingFragments = [
            '// ResumoFinanceiro shared branding image directory',
            'Bundle.main.object(forInfoDictionaryKey: "ExpoWidgetsAppGroupIdentifier") as? String',
            'FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroupIdentifier)',
            'env["widgetsDirectory"] = appGroupContainer.appendingPathComponent("ExpoWidgets", isDirectory: true).absoluteString',
          ];
          for (const fragment of brandingFragments) {
            if (count(utils, fragment) !== 1) {
              throw new Error(`::error::Expo Widgets shared environment is missing or duplicates branding fragment: ${fragment}`);
            }
          }
          if (count(entryView, 'getWidgetEnvironment(environment: environment)') !== 1) {
            throw new Error('::error::Expo Widgets shared entry view is not using the shared environment helper');
          }

          for (const fragment of [
            '// RIGATTI_DELIVERY_WIDGET_ACTIONS_V1',
            'import ActivityKit',
            'struct RigattiDeliveryCompletionIntent: LiveActivityIntent',
            'Activity<LiveActivityAttributes>.activities',
          ]) {
            if (!intent.includes(fragment)) {
              throw new Error(`::error::Generated delivery Live Activity intent is missing ${fragment}`);
            }
          }
          for (const fragment of [
            'import ActivityKit',
            'struct LiveActivityAttributes: ActivityAttributes',
            'ActivityConfiguration(for: LiveActivityAttributes.self)',
          ]) {
            if (!liveActivity.includes(fragment)) {
              throw new Error(`::error::Expo Widgets ActivityKit source is missing ${fragment}`);
            }
          }
          if (!podspec.includes('s.source_files = "**/*.{h,m,swift}"')) {
            throw new Error('::error::ExpoWidgets podspec does not include generated Swift intent sources');
          }

          console.log('Confirmed generated widgets, Live Activity App Intent/ActivityKit source, and shared branding environment');
          NODE

          WIDGET_APP_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :ExpoWidgetsAppGroupIdentifier' "$WIDGET_INFO_PLIST")
          WIDGET_ENTITLEMENT_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' "$WIDGET_ENTITLEMENTS")
          [ -n "$WIDGET_APP_GROUP" ] && [ "$WIDGET_APP_GROUP" = "$WIDGET_ENTITLEMENT_GROUP" ] || {
            echo '::error::WidgetKit Info.plist App Group identifier does not match its generated App Group entitlement'
            exit 1
          }
          WIDGET_ACTIONS_ENDPOINT=$(/usr/libexec/PlistBuddy -c 'Print :RigattiDeliveryWidgetActionsURL' "$WIDGET_INFO_PLIST")
          WIDGET_ACTIONS_ACCESS_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :RigattiDeliveryWidgetKeychainAccessGroup' "$WIDGET_INFO_PLIST")
          WIDGET_KEYCHAIN_ACCESS_GROUP=$(/usr/libexec/PlistBuddy -c 'Print :keychain-access-groups:0' "$WIDGET_ENTITLEMENTS")
          [ -n "$WIDGET_ACTIONS_ENDPOINT" ] && [ -n "$WIDGET_ACTIONS_ACCESS_GROUP" ] && \
            [ "$WIDGET_ACTIONS_ACCESS_GROUP" = "$WIDGET_KEYCHAIN_ACCESS_GROUP" ] || {
            echo '::error::Delivery App Intent endpoint/keychain configuration is missing or inconsistent'
            exit 1
          }

          mkdir -p build/widgetkit-preflight
          xcodebuild \
            -showBuildSettings \
            -project "$APP_PROJECT" \
            -target "$WIDGET_TARGET" \
            -configuration Release \
            -sdk iphonesimulator \
            > build/widgetkit-preflight/widget-build-settings.txt
          grep -Fq 'CONFIGURATION = Release' build/widgetkit-preflight/widget-build-settings.txt || {
            echo '::error::ExpoWidgetsTarget did not resolve to the Release configuration'
            exit 1
          }
          grep -Fq 'SDKROOT = iphonesimulator' build/widgetkit-preflight/widget-build-settings.txt || {
            echo '::error::ExpoWidgetsTarget did not resolve to the iOS Simulator SDK'
            exit 1
          }

          echo "Confirmed WidgetKit target $WIDGET_TARGET, Live Activity registration, App Intent configuration, Release / iphonesimulator, and matching App Groups"

      - name: Compile WidgetKit CocoaPods dependencies only
        timeout-minutes: 45
        run: |
          set -euo pipefail
          PODS_PROJECT="ios/Pods/Pods.xcodeproj"
          PODS_TARGET="Pods-ExpoWidgetsTarget"
          mkdir -p build/widgetkit-preflight
          [ -d "$PODS_PROJECT" ] || { echo "::error::CocoaPods project not found at $PODS_PROJECT"; exit 1; }

          TARGETS_JSON=$(xcodebuild -list -json -project "$PODS_PROJECT")
          printf '%s' "$TARGETS_JSON" | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => (input += chunk));
            process.stdin.on("end", () => {
              const project = JSON.parse(input).project;
              const target = process.argv[1];
              if (!project?.targets?.includes(target)) {
                console.error(`::error::Generated Pods project has no target named ${target}`);
                console.error(`Available targets: ${(project?.targets || []).join(", ")}`);
                process.exit(1);
              }
              console.log(`Generated CocoaPods aggregate target confirmed: ${target}`);
            });
          ' "$PODS_TARGET"

          xcodebuild \
            -showBuildSettings \
            -project "$PODS_PROJECT" \
            -target "$PODS_TARGET" \
            -configuration Release \
            -sdk iphonesimulator \
            > build/widgetkit-preflight/pods-widget-build-settings.txt
          grep -Fq 'CONFIGURATION = Release' build/widgetkit-preflight/pods-widget-build-settings.txt || {
            echo "::error::$PODS_TARGET did not resolve to the Release configuration"
            exit 1
          }
          grep -Fq 'SDKROOT = iphonesimulator' build/widgetkit-preflight/pods-widget-build-settings.txt || {
            echo "::error::$PODS_TARGET did not resolve to the iOS Simulator SDK"
            exit 1
          }

          xcodebuild \
            -project "$PODS_PROJECT" \
            -target "$PODS_TARGET" \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/widgetkit-preflight/widget-pods-xcodebuild.log

          for module_map in \
            ios/build/Release-iphonesimulator/Expo/Expo.modulemap \
            ios/build/Release-iphonesimulator/ExpoModulesWorklets/ExpoModulesWorklets.modulemap \
            ios/build/Release-iphonesimulator/ExpoUI/ExpoUI.modulemap \
            ios/build/Release-iphonesimulator/ExpoWidgets/ExpoWidgets.modulemap; do
            [ -f "$module_map" ] || {
              echo "::error::Widget CocoaPods dependency build did not generate required module map: $module_map"
              exit 1
            }
            echo "Generated module map: $module_map"
          done

      - name: Compile WidgetKit extension only
        timeout-minutes: 45
        run: |
          set -euo pipefail
          mkdir -p build/widgetkit-preflight
          xcodebuild \
            -project ios/emporiorigatti.xcodeproj \
            -target ExpoWidgetsTarget \
            -configuration Release \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/widgetkit-preflight/widget-extension-xcodebuild.log
